<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applied AI Engineering</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Source+Serif+4:wght@400;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151B;
    --surface:#181C24;
    --surface-2:#1E232D;
    --ink:#E7E5DF;
    --muted:#8B909C;
    --brass:#C08A3E;
    --brass-dim:rgba(192,138,62,.35);
    --rust:#A6503E;
    --rule:rgba(231,229,223,.12);
    --max:680px;
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Source Serif 4', serif; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:var(--brass);}
  ::selection{background:var(--brass-dim);}

  /* ---- topbar ---- */
  header.top{
    position:sticky; top:0; z-index:50;
    background:rgba(18,21,27,.82); backdrop-filter:blur(10px);
    border-bottom:1px solid var(--rule);
    padding:16px 24px; display:flex; align-items:center; justify-content:space-between;
  }
  .brand{ font-family:'IBM Plex Mono'; font-size:.72rem; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  .brand b{ color:var(--ink); font-weight:500; }
  .docket-badge{
    font-family:'IBM Plex Mono'; font-size:.68rem; color:var(--brass);
    border:1px solid var(--brass-dim); padding:4px 10px; border-radius:2px;
  }

  /* ---- hero ---- */
  .hero{ max-width:var(--max); margin:0 auto; padding:88px 24px 56px; text-align:left; }
  .eyebrow{
    font-family:'IBM Plex Mono'; font-size:.72rem; letter-spacing:.16em; text-transform:uppercase;
    color:var(--muted); margin:0 0 22px; display:flex; align-items:center; gap:10px;
  }
  .eyebrow::before{ content:''; width:22px; height:1px; background:var(--brass); display:inline-block; }
  h1.tagline{
    font-family:'Fraunces'; font-style:italic; font-weight:500;
    font-size:clamp(1.9rem, 5.2vw, 3rem); line-height:1.18; margin:0 0 8px; color:var(--ink);
    min-height:1.3em;
  }
  .tagline .cursor{ display:inline-block; width:2px; background:var(--brass); margin-left:2px; animation:blink 1s steps(1) infinite; }
  @keyframes blink{ 50%{ opacity:0; } }
  .desc{ color:var(--muted); font-size:1rem; max-width:52ch; margin:18px 0 0; }

  /* ---- stamp ---- */
  .stamp-wrap{ margin-top:38px; display:flex; align-items:center; gap:18px; opacity:0; transform:translateY(6px) rotate(-6deg) scale(.85); }
  .stamp-wrap.show{ animation:stampIn .55s cubic-bezier(.2,1.4,.4,1) forwards; }
  @keyframes stampIn{ 0%{opacity:0; transform:translateY(6px) rotate(-8deg) scale(.7);} 60%{opacity:1; transform:translateY(-2px) rotate(-3deg) scale(1.06);} 100%{opacity:1; transform:translateY(0) rotate(-4deg) scale(1);} }
  .stamp{
    width:104px; height:104px; border-radius:50%; border:2px solid var(--rust);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
    position:relative; color:var(--rust); font-family:'IBM Plex Mono';
  }
  .stamp::before{ content:''; position:absolute; inset:6px; border:1px solid var(--rust); border-radius:50%; opacity:.5; }
  .stamp-text{ text-align:center; font-size:.62rem; letter-spacing:.08em; line-height:1.5; text-transform:uppercase; }
  .stamp-note{ font-family:'IBM Plex Mono'; font-size:.78rem; color:var(--muted); }
  .stamp-note b{ color:var(--ink); font-weight:500; }

  /* ---- feed ---- */
  main{ max-width:var(--max); margin:0 auto; padding:0 24px 100px; }
  .feed-head{ display:flex; align-items:baseline; justify-content:space-between; border-bottom:1px solid var(--rule); padding-bottom:12px; margin-bottom:8px; }
  .feed-head h2{ font-family:'IBM Plex Mono'; font-size:.78rem; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); font-weight:500; margin:0; }
  .feed-count{ font-family:'IBM Plex Mono'; font-size:.72rem; color:var(--muted); }

  .card{
    display:block; text-decoration:none; color:inherit;
    padding:26px 0; border-bottom:1px solid var(--rule);
    position:relative; transition:padding-left .25s ease;
  }
  .card:hover{ padding-left:10px; }
  .card:hover .card-title{ color:var(--brass); }
  .card::before{
    content:''; position:absolute; left:-24px; top:26px; bottom:auto; width:0; height:1px; background:var(--brass);
    transition:width .25s ease;
  }
  .card:hover::before{ width:18px; }
  .card-meta{ font-family:'IBM Plex Mono'; font-size:.68rem; color:var(--muted); letter-spacing:.06em; text-transform:uppercase; display:flex; gap:12px; margin-bottom:8px; }
  .card-meta .docket{ color:var(--brass); }
  .card-title{ font-family:'Fraunces'; font-weight:600; font-size:1.32rem; margin:0 0 8px; transition:color .2s ease; }
  .card-hook{ color:var(--muted); font-size:.96rem; margin:0 0 10px; max-width:56ch; }
  .card-tags{ display:flex; gap:8px; flex-wrap:wrap; }
  .tag{ font-family:'IBM Plex Mono'; font-size:.65rem; color:var(--brass); border:1px solid var(--brass-dim); padding:2px 8px; border-radius:2px; text-transform:lowercase; }
  .pinned-flag{ font-family:'IBM Plex Mono'; font-size:.62rem; color:var(--rust); letter-spacing:.1em; text-transform:uppercase; }

  /* ---- empty state ---- */
  .empty{ padding:60px 0; text-align:left; }
  .empty .seal{ width:56px; height:56px; border:1.5px dashed var(--rule); border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:18px; }
  .empty .seal span{ font-family:'IBM Plex Mono'; font-size:.62rem; color:var(--muted); }
  .empty h3{ font-family:'Fraunces'; font-style:italic; font-weight:500; font-size:1.4rem; margin:0 0 8px; color:var(--ink); }
  .empty p{ color:var(--muted); max-width:48ch; margin:0; font-size:.95rem; }

  footer{
    border-top:1px solid var(--rule); padding:36px 24px 60px; max-width:var(--max); margin:0 auto;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
  }
  footer .desc-line{ color:var(--muted); font-size:.82rem; max-width:44ch; font-family:'IBM Plex Mono'; line-height:1.6; }
  footer a.home{ font-family:'IBM Plex Mono'; font-size:.78rem; color:var(--brass); text-decoration:none; border-bottom:1px solid var(--brass-dim); padding-bottom:2px; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }
</style>
</head>
<body>

<header class="top">
  <div class="brand"><b>Applied AI Engineering</b></div>
  <div class="docket-badge" id="docketBadge">DOCKET —</div>
</header>

<section class="hero">
  <p class="eyebrow">Applied AI Engineering — Flagship Synthesis</p>
  <h1 class="tagline" id="tagline"><span id="taglineText"></span><span class="cursor" id="cursor"></span></h1>
  <p class="desc" id="descText">Loading site description…</p>

  <div class="stamp-wrap" id="stampWrap">
    <div class="stamp">
      <div class="stamp-text">Brief<br>Filed<br>No. 001</div>
    </div>
    <p class="stamp-note">Every piece here is <b>argued</b>, not just published — a position, a counterargument, and a verdict.</p>
  </div>
</section>

<main>
  <div class="feed-head">
    <h2>Filed Arguments</h2>
    <span class="feed-count" id="feedCount">—</span>
  </div>
  <div id="feed"></div>
</main>

<footer>
  <div class="desc-line" id="footerDesc">applied-ai-engineering</div>
  <a class="home" href="https://iggym.github.io/applied-ai-engineering/">↑ applied-ai-engineering</a>
</footer>

<script>
(async function(){
  const taglineEl = document.getElementById('taglineText');
  const cursorEl = document.getElementById('cursor');
  const stampWrap = document.getElementById('stampWrap');
  const descEl = document.getElementById('descText');
  const footerDesc = document.getElementById('footerDesc');
  const docketBadge = document.getElementById('docketBadge');
  const feedEl = document.getElementById('feed');
  const feedCount = document.getElementById('feedCount');

  let data = { site:{ title:'Applied AI Engineering', tagline:'Past the taxonomy. Into the argument.', description:'', base_url:'https://iggym.github.io/applied-ai-engineering/' }, articles:[] };
  try{
    const res = await fetch('./metadata.json');
    if(res.ok) data = await res.json();
  }catch(e){ /* fall back to defaults above */ }

  const tagline = (data.site && data.site.tagline) || 'Past the taxonomy. Into the argument.';
  const desc = (data.site && data.site.description) || '';
  document.title = (data.site && data.site.title) || document.title;
  descEl.textContent = desc;
  footerDesc.textContent = desc;

  // typewriter for tagline, respecting reduced motion
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function typeOut(text, el, done){
    if(reduced){ el.textContent = text; done(); return; }
    let i = 0;
    (function step(){
      el.textContent = text.slice(0, i);
      i++;
      if(i <= text.length){ setTimeout(step, 22); }
      else { done(); }
    })();
  }
  typeOut(tagline, taglineEl, ()=>{
    cursorEl.style.display = 'none';
    stampWrap.classList.add('show');
  });

  // articles
  const published = (data.articles || []).filter(a => a.status === 'published');
  const pinned = published.filter(a => a.pinned);
  const rest = published.filter(a => !a.pinned).sort((a,b)=> new Date(b.date) - new Date(a.date));
  const ordered = [...pinned, ...rest];

  docketBadge.textContent = 'DOCKET — ' + String(published.length).padStart(3,'0');
  feedCount.textContent = published.length + (published.length === 1 ? ' brief' : ' briefs');

  function fmtDate(d){
    try{ return new Date(d).toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }); }
    catch(e){ return d; }
  }

  if(ordered.length === 0){
    feedEl.innerHTML = `
      <div class="empty">
        <div class="seal"><span>N/A</span></div>
        <h3>No briefs filed yet.</h3>
        <p>The first argument is being drafted. Case No. 001 opens the docket.</p>
      </div>`;
  } else {
    feedEl.innerHTML = ordered.map((a, idx) => `
      <a class="card" href="${a.path}">
        <div class="card-meta">
          <span class="docket">No. ${a.id || String(idx+1).padStart(3,'0')}</span>
          <span>${fmtDate(a.date)}</span>
          <span>${a.reading_time_minutes ? a.reading_time_minutes + ' min' : ''}</span>
          ${a.pinned ? '<span class="pinned-flag">· Lead Brief</span>' : ''}
        </div>
        <h3 class="card-title">${a.title}</h3>
        <p class="card-hook">${a.hook || ''}</p>
        <div class="card-tags">${(a.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div>
      </a>
    `).join('');
  }
})();
</script>
</body>
</html>
