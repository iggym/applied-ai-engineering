<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Applied AI Engineering</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --heading: #f0f6fc;
      --accent: #2f81f7;
      --accent-hover: #58a6ff;
      --font-mono: ui-monospace, SFMono-Regular, SF Mono, Menlo, Consolas, Liberation Mono, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      max-width: 680px;
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 2.5rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: rgba(47, 129, 247, 0.1);
      border: 1px solid rgba(47, 129, 247, 0.3);
      color: var(--accent-hover);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #238636;
      border-radius: 50%;
    }

    h1 {
      color: var(--heading);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    p {
      color: var(--text);
      font-size: 1.05rem;
      margin-bottom: 1.5rem;
    }

    .code-block {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      font-family: var(--font-mono);
      font-size: 0.9rem;
      color: #79c0ff;
      overflow-x: auto;
      margin-bottom: 1.5rem;
    }

    .links {
      display: flex;
      gap: 1rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
      transition: color 0.15s ease;
    }

    a:hover {
      color: var(--accent-hover);
      text-decoration: underline;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.85rem;
      color: #8b949e;
      text-align: center;
    }
  </style>
</head>
<body>

  <main class="container">
    <div class="status-badge">
      <span class="status-dot"></span> Active Deployment
    </div>
    <h1>Applied AI Engineering</h1>
    <p>Repository site successfully initialized. Ready to serve dynamic web components and static assets.</p>

    <div class="code-block">
      $ git status<br>
      On branch main<br>
      Your branch is up to date with 'origin/main'.
    </div>

    <div class="links">
      <a href="https://github.com/iggym/applied-ai-engineering" target="_blank" rel="noopener">View Repository</a>
    </div>
  </main>

  <footer>
    GitHub Pages &bull; Hosted directly from the <code>main</code> branch root.
  </footer>

</body>
</html>
