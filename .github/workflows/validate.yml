name: Validate Metadata and Content

on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    name: Validate metadata and links

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Run metadata validator
        run: python3 scripts/validate-metadata.py
        continue-on-error: true

      - name: Install lychee for link checking
        uses: lycheeverse/lychee-action@v1.8.0
        with:
          args: --config .lycheeignore.toml articles/**/*.html index.html
          fail: false
